<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; margin: 0; padding: 14px; font-family: system-ui, sans-serif;
           background: #1e1f24; color: #eee; }
    h1 { font-size: 18px; margin: 0 0 10px; color: #E0A84F; }
    .url { font-size: 12px; color: #999; word-break: break-all; margin-bottom: 12px; min-height: 16px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #E0A84F;
             color: #1a1a1a; font-weight: 600; cursor: pointer; }
    button:hover { background: #C98F3A; }
    #status { margin-top: 10px; font-size: 13px; min-height: 16px; }
    .ok { color: #7bd389; } .err { color: #E07A5F; }
  </style>
</head>
<body>
  <h1>DownX</h1>
  <div class="url" id="url"></div>
  <button id="send">Send to DownX</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
